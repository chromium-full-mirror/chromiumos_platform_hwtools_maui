default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
        exclude: .*\.svg
    -   id: trailing-whitespace
        exclude: .*\.svg
    -   id: check-toml
    -   id: check-merge-conflict

  - repo: local
    hooks:
    - id: black
      name: Black (Docker)
      entry: pyfound/black:25.9.0 black
      language: docker_image
      exclude: servo/data/.*
      types: [python]

  - repo: local
    hooks:
    - id: isort
      name: isort (Docker)
      entry: xcgd/isort isort
      language: docker_image
      types: [python]

  - repo: local
    hooks:
    - id: pylint
      name: pylint
      entry: pylint
      language: system
      exclude: ^hooks/
      types: [python]
      args:
        [
          "-rn", # Only display messages
          "-sn", # Don't display the score
        ]

  - repo: local
    hooks:
    - id: banned-words
      stages: [pre-commit, commit-msg]
      name: banned-words
      entry: hooks/banned-words.py
      language: python
      types: [text]

  - repo: local
    hooks:
    - id: copyright
      name: copyright
      entry: hooks/copyright.py
      language: python
      types: [text]
      exclude: |
            (?x)^(
                docs/.*|
                .*md|
                .*\.hex|
                .gitignore|
                LICENSE|
                DIR_METADATA|
                PRESUBMIT.cfg|
                .*\.json|
                e2e-tests/images/.*
            )$

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
    -   id: shellcheck

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
    -   id: clang-format
        types_or: [c++, c]
