// Maui machine-to-machine RPC protocol (go/maui-ite-design, "Host Automation
// & Machine Interface").
//
// TRANSPORT
//   The second USB CDC-ACM interface of the Application, whose USB interface
//   string is "Maui RPC" (typically /dev/ttyACM1). Each message is one
//   serialized Envelope, COBS-encoded and terminated by a single 0x00. Empty
//   frames (consecutive 0x00) are ignored on both sides: the host sends one to
//   resynchronize, and the firmware also starts every frame with a 0x00 so a
//   frame that was cut short never corrupts the next one.
//
// FLOW
//   Request  -> host picks a non-zero seq; exactly one Response echoes it.
//   Event    -> unsolicited firmware notification, seq = 0. Events carry an
//               MCU timestamp and their own event_seq; they are dropped rather
//               than delay the firmware, so a gap in event_seq means a loss.
//   The firmware handles requests strictly in order, so a host may pipeline
//   several requests and match the responses by seq.
//
// EXTENDING
//   Messages are grouped by functional domain. Every domain owns a block of
//   field numbers in Request, Response and Event (see the table below) so
//   domains can grow independently without renumbering. To add a call:
//     1. Define <Name>Request / <Name>Response in the domain section.
//     2. Add them to the Request/Response oneofs inside the domain's block.
//     3. Firmware: RPC_HANDLER_DEFINE(...) in the domain's src/rpc/rpc_*.c.
//     4. Host:    add a method to the domain's service in tools/maui_libs.
//   The host discovers what a firmware supports through
//   PingResponse.supported_requests, so new host tools degrade gracefully on
//   older firmware.
//
//   Field-number blocks (Request / Response / Event oneofs). All numbers up to
//   2047 encode in two bytes, so the wide blocks cost nothing on the wire:
//        1 -  99  common fields (status/error in Response, timestamp in Event)
//      100 - 199  system    (ping, version, reboot, ...)
//      200 - 299  h2h       (Prolific PL27A1 SPI flash)
//      300 - 399  pdc       (TPS66994 control, FW update)      [planned]
//      400 - 499  mux       (SBU / host / H2H muxes)            [planned]
//      500 - 599  adc       (rail and CC voltages)             [planned]
//      600 - 699  thermal   (TMP110)                           [planned]
//      700 - 799  stats     (persistent lifetime statistics)   [planned]
//      800 - 899  gpio/led                                     [planned]
//      900 - 999  storage   (serial number, NVS)               [planned]
//   Every Request has a Response message of the same name and number, even if
//   it is empty today, so fields can be added later without breaking anyone.
//
// This file is shared by the firmware (Nanopb, generated at build time) and the
// host tools (tools/maui_libs/proto/maui_rpc_pb2.py, checked in). Regenerate
// the Python module with tools/scripts/gen_proto.sh after editing.

syntax = "proto3";

package maui.rpc;

// Bumped only on incompatible changes. Adding messages is compatible.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 1;
}

enum Status {
  STATUS_OK = 0;
  STATUS_ERROR = 1;
  STATUS_INVALID_ARGUMENT = 2;
  STATUS_BAD_STATE = 3;
  STATUS_IO_ERROR = 4;
  STATUS_VERIFY_FAILED = 5;
  STATUS_UNSUPPORTED = 6;
  STATUS_TOO_LARGE = 7;
  STATUS_BUSY = 8;
  STATUS_TIMEOUT = 9;
  STATUS_NOT_FOUND = 10;
  STATUS_ABORTED = 11;
}

// ---------------------------------------------------------------------------
// system (100 - 199)
// ---------------------------------------------------------------------------

message PingRequest {
  uint32 token = 1;
}

message PingResponse {
  uint32 token = 1;
  uint32 protocol_version = 2;
  string fw_version = 3;
  // Request oneof field numbers this firmware implements.
  repeated uint32 supported_requests = 4;
}

// ---------------------------------------------------------------------------
// h2h (200 - 299): reading and programming the SPI flash of the Prolific
// PL27A1 bridge.
//
// Write session: H2hBegin (acquire bus, full-chip erase) -> H2hWrite x N
// (strictly sequential offsets, each chunk <= max_chunk_size) -> H2hFinish
// (the MCU reads the flash back and checks CRC-32 against image_crc32, then
// returns the bus to the PL27A1).
//
// Read session: H2hReadBegin (acquire bus) -> H2hRead x N (any offset, each
// chunk <= max_chunk_size, within the flash) -> H2hReadEnd (return the bus to
// the PL27A1).
//
// The PL27A1 is held in reset for the whole session. Only one session exists
// at a time; starting one ends any other. H2hAbort, any failed request, or
// CONFIG_MAUI_RPC_H2H_IDLE_TIMEOUT_MS of inactivity ends the session and
// releases the bus. H2hProgressEvent reports long-running phases.
// CRC-32 is IEEE 802.3 (zlib.crc32).
// ---------------------------------------------------------------------------

enum H2hPhase {
  H2H_PHASE_UNSPECIFIED = 0;
  H2H_PHASE_ERASE = 1;
  H2H_PHASE_PROGRAM = 2;  // Tracked by the host from its own writes.
  H2H_PHASE_VERIFY = 3;
}

message H2hInfoRequest {}

message H2hInfoResponse {
  // JEDEC ID as 0xMMTTCC (manufacturer, type, capacity).
  uint32 jedec_id = 1;
  uint32 flash_size = 2;
}

message H2hBeginRequest {
  uint32 image_size = 1;
  uint32 image_crc32 = 2;
}

message H2hBeginResponse {
  uint32 jedec_id = 1;
  uint32 flash_size = 2;
  uint32 max_chunk_size = 3;
}

message H2hWriteRequest {
  uint32 offset = 1;
  bytes data = 2;
}

message H2hWriteResponse {}

message H2hFinishRequest {}

message H2hFinishResponse {
  uint32 flash_crc32 = 1;
  // From H2hBegin to the end of verification.
  uint32 duration_ms = 2;
}

message H2hAbortRequest {}

message H2hAbortResponse {}

message H2hReadBeginRequest {}

message H2hReadBeginResponse {
  uint32 jedec_id = 1;
  uint32 flash_size = 2;
  uint32 max_chunk_size = 3;
}

message H2hReadRequest {
  uint32 offset = 1;
  uint32 length = 2;
}

message H2hReadResponse {
  uint32 offset = 1;
  bytes data = 2;
}

message H2hReadEndRequest {}

message H2hReadEndResponse {}

message H2hProgressEvent {
  H2hPhase phase = 1;
  uint32 done = 2;
  uint32 total = 3;
}

// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

message Request {
  oneof msg {
    // system
    PingRequest ping = 100;
    // h2h
    H2hBeginRequest h2h_begin = 200;
    H2hWriteRequest h2h_write = 201;
    H2hFinishRequest h2h_finish = 202;
    H2hAbortRequest h2h_abort = 203;
    H2hInfoRequest h2h_info = 204;
    H2hReadBeginRequest h2h_read_begin = 205;
    H2hReadRequest h2h_read = 206;
    H2hReadEndRequest h2h_read_end = 207;
  }
}

message Response {
  Status status = 1;
  // Short human-readable reason when status != STATUS_OK.
  string error = 2;
  // Negative Zephyr errno behind a failure, when there is one.
  sint32 error_code = 3;
  oneof msg {
    // system
    PingResponse ping = 100;
    // h2h
    H2hBeginResponse h2h_begin = 200;
    H2hWriteResponse h2h_write = 201;
    H2hFinishResponse h2h_finish = 202;
    H2hAbortResponse h2h_abort = 203;
    H2hInfoResponse h2h_info = 204;
    H2hReadBeginResponse h2h_read_begin = 205;
    H2hReadResponse h2h_read = 206;
    H2hReadEndResponse h2h_read_end = 207;
  }
}

message Event {
  // MCU uptime when the event was generated.
  uint64 timestamp_ms = 1;
  // Increments for every event the firmware generates, sent or dropped.
  uint32 event_seq = 2;
  oneof msg {
    // h2h
    H2hProgressEvent h2h_progress = 200;
  }
}

message Envelope {
  uint32 seq = 1;
  oneof kind {
    Request request = 2;
    Response response = 3;
    Event event = 4;
  }
}
