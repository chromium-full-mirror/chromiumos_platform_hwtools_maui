# Application-only configuration for maui_v1p2_it82002.
#
# Zephyr merges <app>/boards/<board>.conf only when building THIS application
# (firmware/), so nothing here leaks into the MCUboot RO/RW Bootloader builds
# the way board defconfig entries do. Only genuine hardware/SoC defaults that
# every image on this board needs belong in
# boards/maui_v1p2_it82002/maui_v1p2_it82002_defconfig.

# Peripherals used by the Application only. Leaving these in the board
# defconfig pulled I2C into the bootloaders, which explicitly disable it, and
# produced "I2C was assigned the value n but got the value y" Kconfig warnings.
CONFIG_GPIO_GET_CONFIG=y

CONFIG_ADC=y
CONFIG_ADC_ITE_IT8XXX2=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_TMP112=y
CONFIG_WATCHDOG=y

# USB device_next stack. The bootloaders cannot use it: MCUboot's
# CONFIG_BOOT_SERIAL_CDC_ACM does "select USB_DEVICE_STACK" (the legacy stack)
# unconditionally and has no device_next backend, so enabling both stacks in a
# bootloader build results in duplicate CDC-ACM device definitions.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_IT82XX2=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_BUF_POOL=y
CONFIG_USBD_THREAD_STACK_SIZE=1024
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Shell runs over the CDC-ACM console, so hold output until a host opens the
# port. The bootloaders have no shell, hence this is not a board default.
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
