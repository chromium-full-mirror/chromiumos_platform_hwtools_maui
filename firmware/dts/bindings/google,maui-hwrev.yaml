description: Google MAUI Hardware Revision Id

compatible: "google,maui-hwrev"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: |
      GPIOs used to decode the hardware revision id. Pins should be in
      MSB to LSB order.
