description: Google MAUI GPIOs

compatible: "google,maui-gpios"

include: base.yaml

child-binding:
  description: |
    List of GPIOs to configure at bootup

  properties:
    gpios:
      type: phandle-array
      description: |
        Definition of GPIO's port and pin number with flags
        supporting setting logic states at bootup
