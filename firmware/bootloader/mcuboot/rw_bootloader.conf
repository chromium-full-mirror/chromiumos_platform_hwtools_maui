# MCUboot RW Updatable Bootloader Configuration for ITE IT82002 (128 KB @ 0x00018000)
CONFIG_ROM_START_OFFSET=0x200
CONFIG_BOOT_DIRECT_XIP=y
CONFIG_SINGLE_APPLICATION_SLOT=y
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_BOOT_GO_HOOKS=y
CONFIG_BOOT_IMAGE_ACCESS_HOOKS=y

# Execute directly from Flash to avoid ILM SCAR conflicts during chainloading
CONFIG_SOC_IT8XXX2_SERIAL_IN_RAM=n
CONFIG_SOC_IT8XXX2_KERNEL_IN_RAM=n
CONFIG_SOC_IT8XXX2_ZEPHYR_IN_RAM=n

# Serial Recovery over USB CDC-ACM
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# USB Stack Configuration for MCUboot Serial Recovery (PID 0x5085 matching Main App)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_UDC_IT82XX2=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USBD_CDC_ACM_BUF_POOL=n
CONFIG_USB_DC_IT82XX2=y
CONFIG_USB_DEVICE_VID=0x18D1
CONFIG_USB_DEVICE_PID=0x5085
CONFIG_USB_DEVICE_MANUFACTURER="Google LLC"
CONFIG_USB_DEVICE_PRODUCT="Maui RW Bootloader"
CONFIG_USB_DEVICE_SN="0123456789ABCDEF0123456789ABCDE"

# Footprint Optimizations
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LOG=n
